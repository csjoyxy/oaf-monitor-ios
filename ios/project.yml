name: OAFPulse
options:
  bundleIdPrefix: com.csjoyxy
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"

targets:
  OAFPulse:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: OAFPulse
    info:
      path: OAFPulse/Info.plist
      properties:
        CFBundleDisplayName: "OAF Pulse"
        CFBundleName: "OAFPulse"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "用于连接局域网内的 OpenWrt 路由器并读取 OAF 终端访问统计。"
        CFBundleURLTypes:
          - CFBundleURLName: "com.csjoyxy.oafpulse"
            CFBundleURLSchemes:
              - "oafpulse"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.csjoyxy.oafpulse"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        INFOPLIST_FILE: "OAFPulse/Info.plist"
